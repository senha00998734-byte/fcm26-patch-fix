name: Manter FCM 26 Fix ativo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-uma-vez.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Garantir release publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            "repos/${{ github.repository }}/releases/392248626" \
            -F draft=false >/dev/null
          echo 'FCM 26 Fix ativo.'
